<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 背景：玻璃雨珠（大雨）—— 放 <head> 顶部优先加载；defer 保证 body 就绪后再执行 -->
<script src="/js/玻璃雨珠/玻璃雨珠.js" data-weather="rain" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#050505">
<title>页面走丢了 · 温故流年</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html { margin: 0; height: 100%; background: #050505; }
body { margin: 0; height: 100%; }
body {
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'Kaiti SC', serif;
    color: #e6e1d8;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}


/* 星夜渐变 + 暗角，让雨珠沉在画面之下，文字更清晰 */
.sky {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
        radial-gradient(110% 70% at 50% 118%, rgba(105, 126, 204, 0.20), rgba(105, 126, 204, 0) 62%),
        radial-gradient(90% 52% at 50% -10%, rgba(158, 178, 255, 0.13), rgba(158, 178, 255, 0) 60%),
        radial-gradient(62% 42% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.58) 100%);
}
.noise {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.wrap { position: relative; z-index: 3; text-align: center; padding: 0 26px; max-width: 92vw; }

.code {
    margin: 0; font-family: 'Playfair Display', 'Cinzel', serif;
    font-size: clamp(64px, 21vw, 122px); line-height: 1; letter-spacing: 0.08em;
    color: #f2e6c8;
    text-shadow: 0 0 40px rgba(255, 224, 160, 0.35), 0 0 96px rgba(150, 180, 255, 0.26);
    opacity: 0; animation: up 0.9s ease 0.15s forwards;
}
.t {
    margin: 20px 0 0; font-size: clamp(17px, 4.6vw, 23px); letter-spacing: 0.16em;
    color: #fff; text-shadow: 0 0 22px rgba(255, 228, 180, 0.22);
    opacity: 0; animation: up 1s ease 0.45s forwards;
}
.s {
    margin: 14px 0 0; font-size: 13px; letter-spacing: 0.28em; text-indent: 0.28em;
    color: rgba(198, 210, 240, 0.72);
    opacity: 0; animation: up 1s ease 0.8s forwards;
}
.cd {
    margin: 32px 0 0; font-size: 12px; letter-spacing: 0.22em; text-indent: 0.22em;
    color: rgba(222, 228, 246, 0.62);
    opacity: 0; animation: up 1s ease 1.1s forwards;
}
.cd b { font-family: 'Playfair Display', 'Cinzel', serif; font-size: 17px; color: #e9d9a8; margin: 0 4px; }

#go {
    margin-top: 26px; padding: 14px 44px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 15px; letter-spacing: 0.38em; text-indent: 0.38em;
    color: #efe0b8; border: 1px solid rgba(226, 199, 132, 0.65);
    background: rgba(226, 199, 132, 0.08);
    transition: background 0.3s ease, color 0.3s ease;
    opacity: 0;
    animation: up 0.9s ease 1.4s forwards, glow 2.8s ease-in-out 2.4s infinite;
}
#go::before { content: '✦ '; color: rgba(255, 224, 150, 0.95); }
#go:hover, #go:active { background: rgba(226, 199, 132, 0.22); color: #fff6e2; }

.hint { margin: 18px 0 0; font-size: 11px; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.3); opacity: 0; animation: up 1s ease 1.8s forwards; }

@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glow {
    0%, 100% { box-shadow: 0 0 18px rgba(226, 199, 132, 0.18); }
    50%      { box-shadow: 0 0 34px rgba(226, 199, 132, 0.5), 0 0 60px rgba(150, 180, 255, 0.16); }
}
@media (prefers-reduced-motion: reduce) {
    .code, .t, .s, .cd, #go, .hint { animation: none !important; opacity: 1 !important; }
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<main class="wrap">
    <p class="code">404</p>
    <h1 class="t">这条路，走不到回忆里了</h1>
    <p class="s">页面走丢了 · 回忆还在原地</p>
    <p class="cd">将在 <b id="n">5</b> 秒后回到主页</p>
    <button id="go" type="button">回到主页</button>
    <p class="hint">若没有自动跳转，点上面的按钮</p>
</main>

<script>
(function () {
    var HOME = '/';          // 主页
    var SECONDS = 5;         // 自动返回倒计时

    var nEl = document.getElementById('n');
    var left = SECONDS;
    var timer = setInterval(function () {
        left--;
        if (nEl) nEl.textContent = String(Math.max(left, 0));
        if (left <= 0) { clearInterval(timer); location.replace(HOME); }
    }, 1000);

    var go = document.getElementById('go');
    if (go) {
        go.addEventListener('click', function () { clearInterval(timer); location.replace(HOME); });
    }

})();
</script>

</body>
</html>
